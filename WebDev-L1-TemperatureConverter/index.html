<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>Temperature Converter</h1>


    <label>
        Enter Temperature:
    </label>

    <input 
        type="text" 
        id="temperature"
        placeholder="Enter value">


    <label>
        Select Unit:
    </label>


    <select id="unit">

        <option value="celsius">
            Celsius (°C)
        </option>

        <option value="fahrenheit">
            Fahrenheit (°F)
        </option>

        <option value="kelvin">
            Kelvin (K)
        </option>

    </select>



    <button onclick="convertTemperature()">
        Convert
    </button>


    <p id="error"></p>


    <div class="result">

        <h2>Results</h2>

        <p id="celsius">
            Celsius:
        </p>

        <p id="fahrenheit">
            Fahrenheit:
        </p>

        <p id="kelvin">
            Kelvin:
        </p>

    </div>


</div>



<script src="script.js"></script>


</body>

</html>
